<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Sıfırlama — KernelKompass</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png">
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d08; --panel:#12160e; --border:#262c1b; --border2:#333a24;
  --amber:#e3a94a; --teal:#5fb8a6; --red:#d9705f; --text:#eae6d8; --text-dim:#9a9682;
  --mono:'JetBrains Mono', ui-monospace, monospace; --sans:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
.card{ max-width:380px; margin:100px auto; padding:0 20px;}
.prompt{ font-family:var(--mono); font-size:12px; color:var(--teal); text-align:center; display:block;}
h1{ font-family:var(--mono); font-size:20px; margin:8px 0 24px; text-align:center;}
.form-row{ margin-bottom:14px;}
.form-row label{ display:block; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
.form-row input{
  width:100%; padding:9px 12px; border-radius:6px; border:1px solid var(--border2);
  background:var(--panel); color:var(--text); font-family:var(--sans); font-size:13.5px; outline:none;
}
.form-row input:focus{ border-color:var(--amber);}
.btn{
  width:100%; font-family:var(--mono); font-size:13px; border-radius:22px; padding:11px 20px; cursor:pointer;
  border:1px solid var(--amber); background:var(--amber); color:#161200; font-weight:700; text-align:center;
}
.msg{ font-size:14px; line-height:1.6; padding:12px 16px; border-radius:8px; margin-top:16px; display:none;}
.msg.show{ display:block;}
.msg.ok{ background:rgba(95,184,166,0.1); color:var(--teal);}
.msg.err{ background:rgba(217,112,95,0.1); color:var(--red);}
.back-link{ display:block; text-align:center; margin-top:18px; font-family:var(--mono); font-size:12.5px; color:var(--teal); text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <span class="prompt">user@kernelkompass:~$</span>
  <h1>./reset-password.sh</h1>

  <form id="resetForm">
    <div class="form-row">
      <label>Yeni şifre (en az 6 karakter)</label>
      <input type="password" id="newPassword" required minlength="6" maxlength="128">
    </div>
    <div class="form-row">
      <label>Yeni şifre (tekrar)</label>
      <input type="password" id="newPasswordConfirm" required minlength="6" maxlength="128">
    </div>
    <button type="submit" class="btn">Şifremi Değiştir</button>
    <div class="msg" id="msg"></div>
  </form>

  <a class="back-link" href="index.html">← Uygulamaya dön</a>
</div>

<script>
// AYAR: backend adresi ortak config.js'den geliyor (window.KK_API_BASE).
var KK_API_BASE = window.KK_API_BASE;

(function(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var form = document.getElementById('resetForm');
  var msgEl = document.getElementById('msg');

  function showMsg(text, ok){
    msgEl.textContent = text;
    msgEl.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  if(!token){
    form.style.display = 'none';
    showMsg('Geçersiz bağlantı — token bulunamadı. Uygulamadan "Şifremi unuttum" ile yeni bir bağlantı iste.', false);
    return;
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var p1 = document.getElementById('newPassword').value;
    var p2 = document.getElementById('newPasswordConfirm').value;
    if(p1 !== p2){
      showMsg('Girdiğin iki şifre aynı değil.', false);
      return;
    }
    fetch(KK_API_BASE + '/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: token, new_password: p1})
    }).then(function(res){
      return res.json().then(function(data){ return {ok: res.ok, data: data}; });
    }).then(function(result){
      if(result.ok){
        showMsg(result.data.message || 'Şifren değiştirildi.', true);
        form.querySelector('button').disabled = true;
      } else {
        showMsg((result.data && result.data.detail) || 'Şifre sıfırlama başarısız.', false);
      }
    }).catch(function(){
      showMsg('Sunucuya ulaşılamıyor. İnternet bağlantını kontrol edip tekrar dene.', false);
    });
  });
})();
</script>
</body>
</html>
