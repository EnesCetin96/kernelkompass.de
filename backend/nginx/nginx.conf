# Cloudflare Flexible SSL: Cloudflare↔EC2 arası HTTP, bu yüzden
# sunucuda sadece port 80 dinliyoruz. Let's Encrypt gerekmez.
# X-Forwarded-Proto: https header'ı Cloudflare tarafından ekleniyor.

server {
    listen 80;
    server_name kernelkompass.de www.kernelkompass.de;

    # Cloudflare'den gelen gerçek ziyaretçi IP'sini logla
    real_ip_header CF-Connecting-IP;

    # www → apex yönlendirmesi
    if ($host = 'www.kernelkompass.de') {
        return 301 https://kernelkompass.de$request_uri;
    }

    # Ortak config.js (KK_API_BASE) — hem /webapp hem website'in aynı
    # dosyaya /config.js ile erişmesi için tek fiziksel konum:
    # /var/www/config.js
    location = /config.js {
        root /var/www;
        # no-cache: tarayıcı/Cloudflare her seferinde sunucuya sorar
        # (ETag/304 ile ucuz). KK_API_BASE değişikliği anında yayılır;
        # eskiden 7d+immutable idi ve deploy sonrası 7 gün stale kalabilirdi.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker ASLA uzun süre cache'lenmemeli (endüstri standardı):
    # sw.js stale kalırsa yeni CACHE_NAME hiç devreye girmez ve kullanıcılar
    # eski uygulama kabuğunda takılı kalır (2026-08-04'te canlıda yaşandı:
    # Cloudflare edge, v5 sw.js'i 7 gün HIT'ledi, v8/v9 görünmedi, URL purge
    # gerekti). Exact-match (=) blok, aşağıdaki regex .js bloğunu ezer.
    location = /webapp/sw.js {
        root /var/www;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API → backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Webapp → statik dosyalar (artık /webapp altında)
    # NOT: "root" kullanılıyor (alias değil) çünkü webapp klasörü zaten
    # /var/www/webapp altında ve URL'deki /webapp/ öneki ile fiziksel yol
    # birebir örtüşüyor (root + /webapp/foo.js => /var/www/webapp/webapp/foo.js
    # OLMAZ çünkü webapp klasörünün İÇİNDE bir webapp/ alt klasörü yok;
    # root, nginx'te document root'un ÜSTÜNE URI'yi eklediği için, container
    # içinde /var/www/webapp klasörünün adını da webapp yaptık, böylece
    # root /var/www; + location /webapp/ => /var/www/webapp/... doğru eşleşir).
    location /webapp/ {
        root /var/www;
        index index.html;

        # sections/*.html lazy-load fragments: eğer dosya gerçekten yoksa
        # (sunucuda deploy edilmemiş / yanlış yol) TEMİZ bir 404 dönsün.
        # Bu blok olmadan, aşağıdaki genel try_files fallback'ı eksik
        # bölüm dosyalarını SESSİZCE /webapp/index.html'e (tüm sayfanın
        # kendisine) yönlendiriyordu — 200 OK dönüyordu ama içerik yanlıştı.
        # loadSectionIfNeeded() bunu gerçek bölüm içeriği sanıp panel'in
        # innerHTML'ine basıyordu; bu da index.html'in TAMAMININ (kendi
        # sidebar'ı, kendi varsayılan "How This Workbook Works" paneli
        # dahil) panelin İÇİNE iç içe (nested) enjekte edilmesine yol
        # açıyordu. Sonuç: hangi bölüme tıklanırsa tıklansın, kullanıcı
        # hep aynı donmuş "intro" içeriğini görüyordu (2026-08-03 teşhisi,
        # canlı sitede fetch('sections/p1.html') ve hatta var olmayan bir
        # dosya adıyla test edilerek doğrulandı — HER İKİSİ DE 200 ve
        # index.html ile birebir aynı içeriği (235560 karakter) döndürdü).
        location /webapp/sections/ {
            root /var/www;
            try_files $uri =404;
        }

        try_files $uri $uri/ /webapp/index.html;

        # 1 saat (immutable YOK): exam-data-*.js gibi içerik dosyaları her
        # deploy'da değişebiliyor; 7d+immutable ile Cloudflare edge onları
        # 7 gün stale tutuyordu. 1 saatlik pencere hâlâ CF HIT oranını
        # yüksek tutar ama deploy'lar en geç 1 saatte kendiliğinden yayılır.
        location ~* \.(js|css|png|ico|webmanifest)$ {
            root /var/www;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Landing page (website) → kök dizin
    location / {
        root /var/www/website;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|ico|webmanifest)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
