# --- AŞAMA 2: HTTPS (certbot sertifikası aldıktan sonra nginx.conf ile değiştir) ---
# Komut:
#   cp /etc/kernelkompass/nginx-https.conf /etc/kernelkompass/nginx/nginx.conf
#   docker compose exec nginx nginx -s reload

server {
    listen 80;
    server_name kernelkompass.de www.kernelkompass.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kernelkompass.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kernelkompass.de www.kernelkompass.de;

    ssl_certificate     /etc/letsencrypt/live/kernelkompass.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kernelkompass.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API → backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webapp → statik dosyalar
    location / {
        root /var/www/webapp;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
